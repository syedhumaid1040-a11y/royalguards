name: Build JAR
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix incompatible API call
        run: |
          find . -name "GuardManager.java" -exec sed -i 's/.*setShouldBurnInDaylight.*/\/\/ &/' {} +

      - name: Auto-detect and Build JAR
        run: |
          BUILD_FILE=$(find . -maxdepth 3 \( -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No pom.xml or build.gradle found!"
            find . -maxdepth 3
            exit 1
          fi
          DIR=$(dirname "$BUILD_FILE")
          echo "Found build file in $DIR"
          cd "$DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          elif [[ "$BUILD_FILE" == *"build.gradle"* ]]; then
            gradle build
          else
            mvn -B package
          fi

      - name: Collect JARs
        run: |
          mkdir -p compiled_jars
          find . -path "./compiled_jars" -prune -o -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "gradle-wrapper.jar" -exec cp {} compiled_jars/ \;
          ls -la compiled_jars/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jar
          path: compiled_jars/*.jar

